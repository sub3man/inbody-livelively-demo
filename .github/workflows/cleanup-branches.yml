name: Cleanup merged branches

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged feature branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for b in "claude/improvement-opportunities-review-axgf09" "oss-enhancement/2026-06-13"; do
            if gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$b"; then
              echo "deleted: $b"
            else
              echo "skip (already gone or protected): $b"
            fi
          done
